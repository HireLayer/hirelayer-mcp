startCommand:
  type: stdio
  configSchema:
    type: object
    required: [hirelayerApiKey]
    properties:
      hirelayerApiKey:
        type: string
        description: HireLayer API key (free plan with 50 credits a month at https://hirelayer.co)
  commandFunction: |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { HIRELAYER_API_KEY: config.hirelayerApiKey } })
