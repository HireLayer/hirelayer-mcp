name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got. Include the error message.
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client
      placeholder: Claude Desktop 1.x, Cursor 2.x, VS Code 1.x…
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: hirelayer-mcp and Node.js versions
      placeholder: hirelayer-mcp 1.0.0, Node.js 22.11
  - type: markdown
    attributes:
      value: Never paste your API key or a real candidate's resume. For security issues, follow SECURITY.md instead.
