name: Feature request
description: Suggest a tool, prompt or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you want to do?
      description: Describe the recruiting task or workflow, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested solution
